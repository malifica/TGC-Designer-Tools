name: Publish Beta 6 LiDAR Hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-beta6-lidar-hotfix.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: beta6-release-publication
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
jobs:
  promote-approved-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Promote exact approved EXE, commit source and verify public downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The repository ignores *.json globally. Force-add only the explicit
          # approved-file allowlist, including its profile and hash manifest.
          @'
          from pathlib import Path
          path = Path('PROMOTE_BETA6_LIDAR_HOTFIX.py')
          source = path.read_text(encoding='utf-8')
          old = "command('git', 'add', *SOURCE_FILES"
          assert source.count(old) == 1, 'Publication staging guard mismatch'
          source = source.replace(old, "command('git', 'add', '-f', *SOURCE_FILES", 1)
          exec(compile(source, str(path), 'exec'), {'__name__': '__main__', '__file__': str(path)})
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Beta 6 publication failed; inspect guarded promotion log.' }
      - name: Retain verified publication receipt
        uses: actions/upload-artifact@v6
        with:
          name: Beta6_LiDAR_Hotfix_Publication_Receipt
          path: _promotion_work/PUBLICATION_VERIFIED.json
          if-no-files-found: error
          retention-days: 90
