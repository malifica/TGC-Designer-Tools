name: Publish Beta 6 LiDAR Hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-beta6-lidar-hotfix.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: beta6-release-publication
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
jobs:
  promote-approved-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Promote exact approved EXE, commit source and verify public downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python PROMOTE_BETA6_LIDAR_HOTFIX.py
          if ($LASTEXITCODE -ne 0) { throw 'Beta 6 publication failed; inspect guarded promotion log.' }
      - name: Retain verified publication receipt
        uses: actions/upload-artifact@v6
        with:
          name: Beta6_LiDAR_Hotfix_Publication_Receipt
          path: _promotion_work/PUBLICATION_VERIFIED.json
          if-no-files-found: error
          retention-days: 90
