name: Prepare Beta 8 binary transport codec
on:
  push:
    branches: ['release/beta8-publication']
    paths: ['.github/workflows/beta8-transfer-codec.yml']
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
jobs:
  codec:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.6'
      - name: Package transport library
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-deps --target codec bsdiff4==1.2.6
      - uses: actions/upload-artifact@v6
        with:
          name: Beta8-Transport-Codec
          path: codec/
          retention-days: 2
          if-no-files-found: error
