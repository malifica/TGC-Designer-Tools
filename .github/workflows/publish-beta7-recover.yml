name: Publish retained Beta 7 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-beta7-recover.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: tgc-beta7-publication
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
  BASE_SHA: 826b8cb3d449b797aac53bf6136d1ec2a4b98ea4
  TAG_NAME: v0.5.0-2k25-beta7
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Retrieve exact retained Windows build
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path],text=True))
          artifact=api('actions/artifacts/12600181875')
          assert artifact['name']=='TGC-Beta7-Windows-Release' and not artifact['expired']
          assert artifact['workflow_run']['head_sha']=='fe367e30242e20a519d25a4707209279ca3cbdb3'
          jobs=api('actions/runs/40196186698/jobs')['jobs'];assert len(jobs)==1
          steps={s['name']:s for s in jobs[0]['steps']}
          for name in ['Apply approved Beta 7 updates and user documentation','Verify and build the standard Beta 7 EXE once','Package the exact EXE and checksums','Retain the built assets and matching source for recovery']:
              assert steps[name]['conclusion']=='success',name
          subprocess.run(['gh','run','download','40196186698','--repo',os.environ['GITHUB_REPOSITORY'],'--name','TGC-Beta7-Windows-Release','--dir','recovered'],check=True)
          root=Path('recovered')
          assert hashlib.sha256((root/'source-manifest.json').read_bytes()).hexdigest()=='6a98a7ff86b625f4f7ffb30228d1b89ddd615872ee50f1a25e3c6d8cc50e7751'
          assert hashlib.sha256((root/'published-assets.json').read_bytes()).hexdigest()=='49156628bb5454920549ff76af034290f0633880c289fa7944d9bf75e5fc60d5'
          expected=json.loads((root/'published-assets.json').read_text())
          assert set(p.name for p in (root/'assets').iterdir())==set(expected)
          for name,e in expected.items():
              p=root/'assets'/name
              with p.open('rb') as f:h=hashlib.file_digest(f,'sha256').hexdigest()
              assert h==e['sha256'] and p.stat().st_size==e['bytes'],name
              print('Verified retained asset:',name,h)
          manifest=json.loads((root/'source-manifest.json').read_text())
          assert manifest['base']==os.environ['BASE_SHA']
          for name,h in manifest['after'].items():
              assert hashlib.sha256((root/'source'/name).read_bytes()).hexdigest()==h,name
          print('No build or packaging commands are used in this recovery.')
      - name: Commit exact matching source and create Beta 7 tag
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          base=os.environ['BASE_SHA'];tag=os.environ['TAG_NAME']
          temporary={'.github/workflows/publish-beta7.yml','.github/workflows/publish-beta7-recover.yml'}
          assert git('ls-remote','origin','refs/heads/main').split()[0]==os.environ['GITHUB_SHA'],'main advanced'
          assert git('ls-remote','origin','refs/tags/v0.5.0-2k25-beta6').split()[0]==base,'Beta 6 changed'
          assert not git('ls-remote','origin','refs/tags/'+tag),'Beta 7 already exists'
          assert set(git('diff','--name-only',base,'HEAD').splitlines())==temporary,'Unexpected source changes'
          root=Path.cwd();manifest=json.loads((root/'recovered/source-manifest.json').read_text());allowed=set(manifest['allowed'])
          assert allowed==set(manifest['after'])
          for name in sorted(allowed):
              original=git('ls-files','-s','--',name)
              mode=original.split()[0] if original else '100644'
              assert mode in ('100644','100755')
              data=(root/'recovered/source'/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==manifest['after'][name],name
              path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
              # Stage precisely the source bytes captured before the successful build.
              # Avoid platform newline conversion, and leave all other index entries alone.
              sha=git('hash-object','-w','--no-filters',name)
              git('update-index','--add','--cacheinfo',mode,sha,name)
          for name in sorted(temporary):git('update-index','--force-remove',name)
          staged=set(git('diff','--cached','--name-only',base).splitlines())
          assert staged<=allowed,sorted(staged-allowed)
          for name in allowed:
              contents=subprocess.check_output(['git','show',':'+name])
              assert hashlib.sha256(contents).hexdigest()==manifest['after'][name],name
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','Release Beta 7: faster transforms, CFS controls and resolved-shape tree filtering')
          sha=git('rev-parse','HEAD')
          git('push','--atomic','origin','HEAD:refs/heads/main','HEAD:refs/tags/'+tag)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('RELEASE_SOURCE_SHA='+sha+'\n')
          print('Matching source published:',sha)
      - name: Create Beta 7 draft and upload the already-built downloads
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import os,subprocess
          tag=os.environ['TAG_NAME'];repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['RELEASE_SOURCE_SHA']
          subprocess.run(['gh','release','create',tag,'--repo',repo,'--title','TGC Designer Tools 2K25 - Beta 7','--notes-file','recovered/source/RELEASE_NOTES_v0.5.0-2k25-beta7.md','--prerelease','--draft','--verify-tag','--target',sha],check=True)
          assets=sorted(str(p) for p in Path('recovered/assets').iterdir());assert len(assets)==4
          subprocess.run(['gh','release','upload',tag,*assets,'--repo',repo],check=True)
      - name: Verify all published assets and make Beta 7 public
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import base64,hashlib,json,os,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path],text=True))
          tag=os.environ['TAG_NAME'];sha=os.environ['RELEASE_SOURCE_SHA'];repo=os.environ['GITHUB_REPOSITORY']
          assert api('git/ref/heads/main')['object']['sha']==sha
          assert api('git/ref/tags/'+tag)['object']['sha']==sha
          assert api('git/ref/tags/v0.5.0-2k25-beta6')['object']['sha']==os.environ['BASE_SHA']
          previous=api('releases/tags/v0.5.0-2k25-beta6')
          beta6_exe=next(a for a in previous['assets'] if a['name']=='tgc_gui_2k25_beta6.exe')
          assert beta6_exe['digest']=='sha256:e602dd372fe0d57ed4dac5b6dd3087a76e970224d48ebbaedaf703023fcf4595'
          rel=api('releases/tags/'+tag);assert rel['prerelease'] and rel['draft']
          assert rel['name']=='TGC Designer Tools 2K25 - Beta 7'
          actual={a['name']:a for a in rel['assets']};expected=json.loads(Path('recovered/published-assets.json').read_text())
          assert set(actual)==set(expected)
          for name,e in expected.items():
              a=actual[name];assert a['state']=='uploaded' and a['size']==e['bytes'] and a['digest']=='sha256:'+e['sha256'],name
          notes=Path('recovered/source/RELEASE_NOTES_v0.5.0-2k25-beta7.md').read_text(encoding='utf-8')
          assert rel['body'].strip()==notes.strip()
          readme=api('contents/README.md?ref='+sha)
          assert base64.b64decode(readme['content'])==Path('recovered/source/README.md').read_bytes()
          subprocess.run(['gh','release','edit',tag,'--repo',repo,'--draft=false','--prerelease'],check=True)
          rel=api('releases/tags/'+tag);assert rel['prerelease'] and not rel['draft']
          print('PUBLICATION VERIFIED:',sha,rel['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('Beta 7 published from the retained Windows build. No rebuild or repackaging.\n\n'+rel['html_url']+'\n\nSource: '+sha+'\n')
