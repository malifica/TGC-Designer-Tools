name: Publish TGC Designer Tools Beta 7
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-beta7.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: tgc-beta7-publication
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
  BASE_SHA: 826b8cb3d449b797aac53bf6136d1ec2a4b98ea4
  TAG_NAME: v0.5.0-2k25-beta7
  EXE_NAME: tgc_gui_2k25_beta7
  PACKAGE_NAME: TGC-Designer-Tools-2K25-v0.5.0-2k25-beta7-Windows-x64
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out the existing release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up the established Python version
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.6'
          architecture: x64
          cache: pip
      - name: Apply approved Beta 7 updates and user documentation
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import ast,base64,hashlib,importlib.util,json,lzma,os,subprocess,tempfile,urllib.request
          root=Path.cwd(); workflow='.github/workflows/publish-beta7.yml'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('diff','--name-only',os.environ['BASE_SHA'],'HEAD').splitlines()==[workflow], 'Unexpected source change before publication'
          assert git('rev-parse','refs/tags/v0.5.0-2k25-beta6')==os.environ['BASE_SHA'], 'Beta 6 reference changed'
          assert not git('tag','--list',os.environ['TAG_NAME']), 'Beta 7 tag already exists'
          git('config','core.autocrlf','false')
          tracked=[p for p in git('ls-files').splitlines() if p!=workflow]
          before={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in tracked}
          def blob(sha):
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as r:obj=json.load(r)
              data=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha,'Blob checksum mismatch'
              return data
          chunks=['a009aaae29bd8b59359a1580f7848b74ad1c2599','8fb269829c8ff465cb428c8e0f2a5bf5e241203f','3009354db6befc6bdf8109869eca2c3ab17487f5','d2c453e83070556fa4921ac10dd2943194966e38','d9c95616becf20e7652790719a8e9fd67fd69475','0d1270dae8c61a0069cf341414bb3e6b491e4680','50acfa8f23acd746fd5c328d714a9ca8a5b010c9','90381ec0c016fe8765152b367e4ec00f65891e29','3fe38cd60a19142348f45cd4fae4330582385554']
          packed=b''.join(blob(s) for s in chunks)
          assert hashlib.sha256(packed).hexdigest()=='8358b000f74da055f954b0b363c8adf5088ba565cb96b8e4f1ed6cb5bb5d1d3d'
          files=json.loads(lzma.decompress(packed));assert len(files)==35
          updates=[('progress','APPLY_BETA6_OUTPUT_PROGRESS.py'),('dem','APPLY_BETA6_DEM_PREVIEW_FIX.py'),('cfs','APPLY_BETA7_CFS_UPDATE.py'),('controls','APPLY_BETA7_TREE_CONTROLS.py'),('resolved','APPLY_BETA7_RESOLVED_SHAPES.py')]
          with tempfile.TemporaryDirectory(prefix='approved-beta7-') as td:
              temp=Path(td)
              for name,text in files.items():
                  target=temp/name
                  assert target.resolve().is_relative_to(temp.resolve())
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(text.encode('utf-8'))
              for key,name in updates:
                  print('Applying approved package:',key,flush=True)
                  package=temp/key;spec=importlib.util.spec_from_file_location('release_'+key,package/name)
                  module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
                  module.apply(root,package)
                  assert module.apply(root,package) is None,'Non-idempotent package: '+key
          support=blob('2ef871bfb2dfd2779a3bf1769f1df1beaa7b5700')
          assert hashlib.sha256(support).hexdigest()=='7ca063a2a8227179e75077bc20473ea73a24ccd136d3632b58b9af6ed86566a4'
          docs=json.loads(lzma.decompress(support))
          assert set(docs)=={'README.md','RELEASE_NOTES_v0.5.0-2k25-beta7.md','BUILD_TGC_2K25_BETA7.py','BUILD_TGC_2K25_BETA7.bat'}
          for name,text in docs.items():(root/name).write_bytes(text.encode('utf-8'))
          notes=docs['RELEASE_NOTES_v0.5.0-2k25-beta7.md']
          changelog=root/'CHANGELOG.md';old=changelog.read_text(encoding='utf-8-sig')
          title,sep,body=old.partition('\n');assert sep and title.startswith('#')
          summary=notes.split('## Highlights\n\n',1)[1].split('\n\nThe speed improvements',1)[0]
          changelog.write_bytes((title+'\n\n## v0.5.0-2k25-beta7\n\n'+summary+'\n\n'+body.lstrip('\n')).encode('utf-8'))
          build_doc=root/'BUILD_WINDOWS.md';old=build_doc.read_text(encoding='utf-8-sig')
          title,sep,body=old.partition('\n');assert sep
          current='## Current release: Beta 7\n\nUse `BUILD_TGC_2K25_BETA7.bat` in the source checkout after setting up the existing `.venv_local_osm` environment. Output: `dist\\tgc_gui_2k25_beta7.exe`. The builder stages the executable and replaces an earlier Beta 7 only after a successful build. Beta 6 is not overwritten. The older commands below describe previous release environments.\n\n'
          build_doc.write_bytes((title+'\n\n'+current+body.lstrip('\n')).encode('utf-8'))
          runtime={'GeoPointCloud.py','dem_map_api.py','lidar_map_api.py','tgc_gui.py','tgc_image_terrain.py','osm_alignment_viewer.py','osm_mask_alignment.py','lidar_tree_topology.py','tgc_output_progress.py','tgc_dem_preview.py','tgc_projection_cache.py','tgc_cfs_display.py','tgc_tree_filter_controls.py','tgc_project_paths.py'}
          verifiers={'VERIFY_BETA6_MULTIPOLYGON_MULCH_V1.py','VERIFY_BETA6_CFS_ASYNC_MASK_REBUILD_V3.py','VERIFY_BETA6_TREE_TOPOLOGY.py','VERIFY_BETA6_OUTPUT_PROGRESS.py','VERIFY_BETA6_DEM_PREVIEW_FIX.py','VERIFY_BETA7_CFS.py','VERIFY_BETA7_TREE_CONTROLS.py','VERIFY_BETA7_RESOLVED_SHAPES.py'}
          allowed=runtime|verifiers|set(docs)|{'CHANGELOG.md','BUILD_WINDOWS.md'}
          for name,h in before.items():
              if name not in allowed:assert hashlib.sha256((root/name).read_bytes()).hexdigest()==h,'Unrelated source changed: '+name
          gui=(root/'tgc_gui.py').read_text(encoding='utf-8-sig');assert 'deformable_course_terrain' not in gui
          tree=ast.parse(gui);values={n.targets[0].id:ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id in {'TGC_APP_TITLE','TGC_GUI_VERSION'}}
          assert values=={'TGC_APP_TITLE':'TGC Designer Tools 2K25 - Beta 7','TGC_GUI_VERSION':'v0.5.0-2k25-beta7'}
          publication=root/'publication';source=publication/'source';source.mkdir(parents=True)
          for name in sorted(allowed):
              p=source/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes((root/name).read_bytes())
          manifest={'base':os.environ['BASE_SHA'],'allowed':sorted(allowed),'runtime':sorted(runtime),'before':before,'after':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in sorted(allowed)},'approved_payload_sha256':hashlib.sha256(packed).hexdigest()}
          (publication/'source-manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print('Approved Beta 7 source and user-facing documentation prepared; unrelated source retained.')
      - name: Install the existing dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Requirements installation failed' }
      - name: Compile the unchanged native LiDAR rasterizer
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'MinGW installation failed' }
          $gcc=Get-ChildItem -Path 'C:\ProgramData\mingw64','C:\ProgramData\chocolatey','C:\tools' -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'mingw64.*bin.*gcc\.exe$' } | Select-Object -First 1
          if (-not $gcc) { throw 'Native compiler not found' }
          & $gcc.FullName -O3 -shared -std=c11 -s -o tgc_lidar_fast_native.dll lidar_fast_native.c -lm
          if ($LASTEXITCODE -ne 0) { throw 'Native LiDAR compilation failed' }
      - name: Verify and build the standard Beta 7 EXE once
        shell: pwsh
        run: |
          python BUILD_TGC_2K25_BETA7.py "$pwd"
          if ($LASTEXITCODE -ne 0) { throw 'Beta 7 checks or build failed' }
          if ((Get-Item "dist\$env:EXE_NAME.exe").Length -lt 100MB) { throw 'EXE unexpectedly small' }
      - name: Package the exact EXE and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path.cwd();pub=root/'publication';assets=pub/'assets';assets.mkdir()
          exe=os.environ['EXE_NAME']+'.exe';package_name=os.environ['PACKAGE_NAME']
          shutil.copy2(root/'dist'/exe,assets/exe)
          package=root/'dist'/'release_beta7'/package_name;package.mkdir(parents=True)
          shutil.copy2(assets/exe,package/exe)
          for name in ('LICENSE','README.md','CHANGELOG.md','BUILD_WINDOWS.md','RELEASE_NOTES_v0.5.0-2k25-beta7.md'):
              shutil.copy2(root/name,package/name)
          shutil.copy2(root/'extras'/'splines.json',package/'splines.json')
          shutil.copytree(root/'tree_profiles',package/'tree_profiles')
          archive=assets/(package_name+'.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(package.rglob('*')):
                  if p.is_file():z.write(p,p.relative_to(package).as_posix())
          def digest(path):
              with path.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          expected={}
          for p in (assets/exe,archive):
              h=digest(p);check=assets/(p.name+'.sha256.txt');check.write_bytes((h+'  '+p.name+'\n').encode('ascii'))
              for item in (p,check):expected[item.name]={'sha256':digest(item),'bytes':item.stat().st_size}
              print(p.name,h,p.stat().st_size)
          with zipfile.ZipFile(archive) as z:
              assert hashlib.sha256(z.read(exe)).hexdigest()==expected[exe]['sha256']
              assert 'tree_profiles/pacific_northwest.json' in z.namelist()
          (pub/'published-assets.json').write_text(json.dumps(expected,indent=2),encoding='utf-8')
      - name: Retain the built assets and matching source for recovery
        uses: actions/upload-artifact@v6
        with:
          name: TGC-Beta7-Windows-Release
          path: publication/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Commit matching Beta 7 source and create the new tag
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('ls-remote','origin','refs/heads/main').split()[0]==os.environ['GITHUB_SHA'],'main advanced during build'
          assert git('ls-remote','origin','refs/tags/v0.5.0-2k25-beta6').split()[0]==os.environ['BASE_SHA'],'Beta 6 changed'
          assert not git('ls-remote','origin','refs/tags/'+os.environ['TAG_NAME']),'Beta 7 tag already exists'
          manifest=json.loads(Path('publication/source-manifest.json').read_text())
          allowed=set(manifest['allowed'])
          for name,h in manifest['before'].items():
              if name not in allowed:assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          for name,h in manifest['after'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
              assert Path(name).read_bytes()==(Path('publication/source')/name).read_bytes(),name
          assert not (set(git('diff','--name-only').splitlines())-allowed),'Unexpected tracked changes'
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('rm','.github/workflows/publish-beta7.yml')
          git('add','-f','--',*sorted(allowed))
          git('commit','-m','Release Beta 7: faster transforms, CFS controls and resolved-shape tree filtering')
          sha=git('rev-parse','HEAD')
          git('push','--atomic','origin','HEAD:refs/heads/main','HEAD:refs/tags/'+os.environ['TAG_NAME'])
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('RELEASE_SOURCE_SHA='+sha+'\n')
          print('Published matching source:',sha)
      - name: Upload the new Beta 7 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --title 'TGC Designer Tools 2K25 - Beta 7' --notes-file RELEASE_NOTES_v0.5.0-2k25-beta7.md --prerelease --draft --verify-tag --target $env:RELEASE_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; retained build artifact is available' }
          gh release upload $env:TAG_NAME "publication/assets/$env:EXE_NAME.exe" "publication/assets/$env:EXE_NAME.exe.sha256.txt" "publication/assets/$env:PACKAGE_NAME.zip" "publication/assets/$env:PACKAGE_NAME.zip.sha256.txt" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; reuse the retained artifact without rebuilding' }
      - name: Verify assets and publish the prerelease
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import json,os,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path],text=True))
          sha=os.environ['RELEASE_SOURCE_SHA'];tag=os.environ['TAG_NAME']
          assert api('git/ref/heads/main')['object']['sha']==sha
          assert api('git/ref/tags/'+tag)['object']['sha']==sha
          assert api('git/ref/tags/v0.5.0-2k25-beta6')['object']['sha']==os.environ['BASE_SHA']
          rel=api('releases/tags/'+tag);assert rel['prerelease'] and rel['draft']
          assert rel['name']=='TGC Designer Tools 2K25 - Beta 7'
          actual={a['name']:a for a in rel['assets']}
          expected=json.loads(Path('publication/published-assets.json').read_text())
          assert set(actual)==set(expected)
          for name,e in expected.items():
              a=actual[name];assert a['state']=='uploaded' and a['size']==e['bytes'] and a['digest']=='sha256:'+e['sha256'],name
          assert rel['body'].strip()==Path('RELEASE_NOTES_v0.5.0-2k25-beta7.md').read_text(encoding='utf-8').strip()
          subprocess.run(['gh','release','edit',tag,'--repo',os.environ['GITHUB_REPOSITORY'],'--draft=false','--prerelease'],check=True)
          rel=api('releases/tags/'+tag);assert rel['prerelease'] and not rel['draft']
          print('PUBLICATION VERIFIED:',sha,rel['html_url'])
