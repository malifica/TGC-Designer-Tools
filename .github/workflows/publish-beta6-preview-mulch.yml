name: Publish Retained Beta 6 Preview and Mulch Hotfix

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-beta6-preview-mulch.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: beta6-hotfix-publication
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
  BASE_SHA: 1c6b2692ae6b9d48f2d58598c09bedecc6ec592f
  BUILD_STAGE_SHA: 412503ef79f9f79fd038126a4545e07a26c564ab
  TAG_NAME: v0.5.0-2k25-beta6
  RELEASE_TITLE: TGC Designer Tools 2K25 - Beta 6 Hotfix
  EXE_NAME: tgc_gui_2k25_beta6
  PACKAGE_NAME: TGC-Designer-Tools-2K25-v0.5.0-2k25-beta6-Windows-x64

jobs:
  publish-retained:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retrieve already-built and verified assets - no rebuild
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39632399836 --repo $env:GITHUB_REPOSITORY --name Beta6-Preview-Mulch-Hotfix-20261021 --dir reused
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve retained artifacts.' }

      - name: Restore the exact prepared source and compare to packaged manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess,tempfile,zipfile
          root=Path.cwd()
          def git(*args):return subprocess.check_output(['git',*args],text=True,encoding='utf-8').strip()
          workflow=git('show',os.environ['BUILD_STAGE_SHA']+':.github/workflows/publish-beta6-preview-mulch.yml')
          marker='      - name: Apply scoped hotfix with corrected installer anchors\n        shell: python\n        run: |\n'
          assert workflow.count(marker)==1,'Cannot locate the exact successful preparation step'
          block=workflow.split(marker,1)[1].split('\n      - name:',1)[0]
          lines=[]
          for line in block.splitlines():
              if line.strip():
                  assert line.startswith('          '),'Unexpected YAML indentation'
                  lines.append(line[10:])
              else:lines.append('')
          with tempfile.TemporaryDirectory(prefix='beta6-publish-restore-') as tmp:
              script=Path(tmp)/'prepare.py';script.write_bytes(('\n'.join(lines)+'\n').encode('utf-8'))
              subprocess.run([__import__('sys').executable,str(script)],check=True)
          base=root/'reused'/'release_beta6'
          expected=json.loads((base/'published-assets.json').read_text())
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for data in iter(lambda:f.read(1024*1024),b''):h.update(data)
              return h.hexdigest()
          exe=root/'reused'/(os.environ['EXE_NAME']+'.exe')
          archive=base/(os.environ['PACKAGE_NAME']+'.zip')
          assert digest(exe)=='55a2bdcd7c7723b37823d1da7eec1477f3c39fd29812cb66a622972dab799b04','EXE differs from the verified build'
          assert digest(archive)=='85f1177a562819fddb4107306b465446e8b29afc5a0740a407a2b41ab1a797ac','ZIP differs from the verified build'
          for name,data in expected.items():
              path=exe if name==exe.name else base/name
              assert path.stat().st_size==data['bytes'] and digest(path)==data['sha256'],name
          with zipfile.ZipFile(archive) as z:
              packaged=z.read('BETA6_PREVIEW_MULCH_MANIFEST.json')
              assert packaged==(root/'BETA6_PREVIEW_MULCH_MANIFEST.json').read_bytes(),'Source manifest differs from the built package'
              for name in ['README.md','CHANGELOG.md','BETA6_HOTFIX.md','BETA6_MULTIPOLYGON_MULCH_HOTFIX.md','RELEASE_NOTES_v0.5.0-2k25-beta6.md']:
                  assert z.read(name)==(root/name).read_bytes(),'Documentation mismatch: '+name
          manifest=json.loads(packaged)
          for group in ['runtime_sha256','preserved_sha256']:
              for name,value in manifest[group].items():
                  assert digest(root/name)==value,'Source differs from verified build: '+name
          print('Exact retained EXE, ZIP, both checksums, source manifest and preserved source verified. No rebuild or repackaging.')

      - name: Commit clean matching source with explicit manifest inclusion
        shell: python
        run: |
          from pathlib import Path
          import json,os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True,encoding='utf-8').strip()
          assert git('ls-remote','origin','refs/heads/main').split()[0]==os.environ['GITHUB_SHA'],'main changed concurrently'
          assert git('ls-remote','origin','refs/tags/'+os.environ['TAG_NAME']).split()[0]==os.environ['BASE_SHA'],'tag changed concurrently'
          manifest=json.loads(Path('BETA6_PREVIEW_MULCH_MANIFEST.json').read_text())
          allowed=set(manifest['runtime_sha256'])|{'BUILD_TGC_2K25_BETA6.bat','README.md','CHANGELOG.md','BETA6_HOTFIX.md','BETA6_MULTIPOLYGON_MULCH_HOTFIX.md','BETA6_PREVIEW_MULCH_MANIFEST.json','RELEASE_NOTES_v0.5.0-2k25-beta6.md'}
          modified=set(git('diff','--name-only').splitlines())
          assert not modified-allowed,'Unexpected source modifications: '+repr(modified-allowed)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('rm','.github/workflows/publish-beta6-preview-mulch.yml','BETA6_PREVIEW_MULCH_TRANSFER.json.gz.b64')
          git('add',*sorted(allowed-{'BETA6_PREVIEW_MULCH_MANIFEST.json'}))
          git('add','-f','BETA6_PREVIEW_MULCH_MANIFEST.json')
          git('commit','-m','Beta 6 Hotfix: restore multipolygon previews and lock water to native mulch')
          sha=git('rev-parse','HEAD');git('push','origin','HEAD:main')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('HOTFIX_SOURCE_SHA='+sha+'\n')
          print('Clean source commit:',sha)

      - name: Publish exact retained assets and update existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f $env:TAG_NAME $env:HOTFIX_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Local tag update failed.' }
          git push origin "--force-with-lease=refs/tags/$($env:TAG_NAME):$($env:BASE_SHA)" "refs/tags/$env:TAG_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Tag update failed.' }
          gh release upload $env:TAG_NAME "reused\$env:EXE_NAME.exe" "reused\release_beta6\$env:EXE_NAME.exe.sha256.txt" "reused\release_beta6\$env:PACKAGE_NAME.zip" "reused\release_beta6\$env:PACKAGE_NAME.zip.sha256.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; verified assets remain retained.' }
          $body=Get-Content 'RELEASE_NOTES_v0.5.0-2k25-beta6.md' -Raw
          $payload=@{name=$env:RELEASE_TITLE;body=$body;draft=$false;prerelease=$true;target_commitish=$env:HOTFIX_SOURCE_SHA}|ConvertTo-Json -Compress
          $payload | gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/410916440" --input - | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed.' }

      - name: Verify published tag and all four assets
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import json,os,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path],text=True,encoding='utf-8'))
          sha=os.environ['HOTFIX_SOURCE_SHA'];tag=os.environ['TAG_NAME']
          assert api('git/ref/heads/main')['object']['sha']==sha
          assert api('git/ref/tags/'+tag)['object']['sha']==sha
          r=api('releases/tags/'+tag)
          assert r['name']==os.environ['RELEASE_TITLE'] and r['prerelease'] and not r['draft']
          assert r['target_commitish']==sha
          expected=json.loads(Path('reused/release_beta6/published-assets.json').read_text());assets={a['name']:a for a in r['assets']}
          for name,data in expected.items():
              a=assets[name];assert a['state']=='uploaded' and a['size']==data['bytes'];assert a['digest']=='sha256:'+data['sha256'],name
              print('VERIFIED',name,a['size'],a['digest'])
          assert 'Multipolygon preview and mandatory mulch-water hotfix' in r['body']
          print('PUBLICATION COMPLETE',sha,r['html_url'])
