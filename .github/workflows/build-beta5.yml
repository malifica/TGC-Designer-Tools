name: Build Beta 5 Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: beta5-hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.6 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.6"
          architecture: "x64"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply cumulative Beta 5 hotfix
        shell: pwsh
        run: |
          $applyDir = ".hotfix_apply"
          if (Test-Path $applyDir) { Remove-Item $applyDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $applyDir | Out-Null
          $v4Text = ((Get-ChildItem ".github\hotfix\ept_v4_*.b64" | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          $osmText = ((Get-ChildItem ".github\hotfix\osm_master_*.b64" | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join "")
          [IO.File]::WriteAllBytes("$applyDir\ept_v4.zip", [Convert]::FromBase64String($v4Text))
          [IO.File]::WriteAllBytes("$applyDir\osm_master.zip", [Convert]::FromBase64String($osmText))
          Expand-Archive -Path "$applyDir\ept_v4.zip" -DestinationPath $applyDir -Force
          Expand-Archive -Path "$applyDir\osm_master.zip" -DestinationPath $applyDir -Force
          python "$applyDir\UPDATE_BETA5_AWS_EPT_TRUE_GROUND_METRES_V4.py"
          if ($LASTEXITCODE -ne 0) { throw "AWS EPT true-ground/UI hotfix failed." }
          python "$applyDir\UPDATE_BETA5_OSM_MASTER_EXTENT_MASK_V1.py"
          if ($LASTEXITCODE -ne 0) { throw "OSM master extent/mask hotfix failed." }
          Remove-Item $applyDir -Recurse -Force
          Get-ChildItem -Directory -Filter "_backup_aws_ept_true_ground_v4_*" | Remove-Item -Recurse -Force
          Get-ChildItem -Directory -Filter "_backup_osm_master_extent_mask_*" | Remove-Item -Recurse -Force
          Remove-Item "UPDATE_BETA5_AWS_EPT_TRUE_GROUND_METRES_V4_manifest.json" -Force -ErrorAction SilentlyContinue
          Remove-Item "UPDATE_BETA5_OSM_MASTER_EXTENT_MASK_V1_manifest.json" -Force -ErrorAction SilentlyContinue

      - name: Commit corrected source to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usgs_ept_downloader.py tgc_gui.py lidar_map_api.py infill_image.py README.md CHANGELOG.md RELEASE_NOTES_v0.5.0-2k25-beta5.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Beta 5 Hotfix: correct AWS EPT scale and OSM master masks"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit patched Beta 5 source." }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Could not push patched Beta 5 source to main." }
          } else {
            Write-Host "Corrected Beta 5 source is already committed."
          }
          "BUILD_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Beta 5 hotfix source
        shell: pwsh
        run: |
          python --version
          python VERIFY_BETA5_SOURCE.py
          python -m py_compile tgc_gui.py dem_map_api.py lidar_map_api.py lidar_fast_native.py usgs_lidar_parser.py usgs_ept_downloader.py infill_image.py tgc_image_terrain.py tgc_definitions.py tree_profile_manager.py tree_profile_analyzer.py OSMTGC.py auto_red_mask.py cfs_georef.py lidar_feature_filter.py osm_alignment_viewer.py
          python -c "from pathlib import Path; checks={'usgs_ept_downloader.py':['TGC_AWS_EPT_TRUE_GROUND_METRES_V1','TGC_AWS_EPT_TRANSFORMER_CACHE_V1','TGC_OSM_MASTER_SAFE_EXTENT_V1'],'tgc_gui.py':['TGC_AWS_EPT_CHOOSER_BUTTONS_ALWAYS_VISIBLE_V1','TGC_AWS_EPT_CHOOSER_BLUE_SELECTION_V1','defer_mask_edit_message=bool(local_osm_file)'],'lidar_map_api.py':['TGC_OSM_MASTER_MASK_WRITE_VERIFY_V1','OSM Master Grid mask verified:'],'infill_image.py':['TGC_MASK_HEIGHTMAP_SHAPE_GUARD_V1','Heightmap/mask dimension mismatch']}; missing=[f'{f}: {m}' for f,ms in checks.items() for m in ms if m not in Path(f).read_text(encoding='utf-8')]; assert not missing, '; '.join(missing); print('PASS - cumulative Beta 5 hotfix markers')"
          python -c "import rasterio; print('Rasterio', rasterio.__version__); print('GDAL', rasterio.__gdal_version__)"

      - name: Install MinGW-w64
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $gcc = Get-ChildItem -Path "C:\ProgramData\chocolatey","C:\ProgramData\mingw64","C:\tools" -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "mingw64.*bin.*gcc\.exe$" } | Select-Object -First 1
          if (-not $gcc) {
            $cmd = Get-Command gcc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $gcc = Get-Item $cmd.Source }
          }
          if (-not $gcc) { throw "MinGW-w64 gcc.exe was not found after installation." }
          "TGC_CC=$($gcc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using MinGW-w64 compiler: $($gcc.FullName)"

      - name: Compile native LiDAR rasterizer
        shell: pwsh
        run: |
          & "$env:TGC_CC" -O3 -shared -std=c11 -s -o tgc_lidar_fast_native.dll lidar_fast_native.c -lm
          if ($LASTEXITCODE -ne 0) { throw "Native LiDAR compile failed." }
          if (-not (Test-Path "tgc_lidar_fast_native.dll")) { throw "Native LiDAR DLL was not created." }
          Write-Host "Native LiDAR DLL size:" (Get-Item "tgc_lidar_fast_native.dll").Length

      - name: Build Beta 5 Hotfix EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name "tgc_gui_2k25_beta5" --add-binary "./laszip/laszip-cli.exe;laszip" --add-binary "tgc_lidar_fast_native.dll;." --additional-hooks-dir "./PyInstaller/hooks/" --runtime-hook "./PyInstaller/rthook_rasterio.py" --add-data "./tree_profiles;tree_profiles" tgc_gui.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed." }
          if (-not (Test-Path "dist\tgc_gui_2k25_beta5.exe")) { throw "Expected EXE was not created." }

      - name: Package Beta 5 Hotfix release build
        shell: pwsh
        run: |
          $pkg = "TGC-Designer-Tools-2K25-v0.5.0-2k25-beta5-Windows-x64"
          $base = "dist\release_beta5"
          $dir = Join-Path $base $pkg
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "dist\tgc_gui_2k25_beta5.exe" $dir
          Copy-Item "LICENSE" $dir
          Copy-Item "README.md" $dir
          Copy-Item "CHANGELOG.md" $dir
          Copy-Item "BUILD_WINDOWS.md" $dir
          Copy-Item "BETA5_TREE_PROFILES.md" $dir
          Copy-Item "RELEASE_NOTES_v0.5.0-2k25-beta5.md" $dir
          Copy-Item "BETA5_HOTFIX.md" $dir
          Copy-Item "tree_profiles" (Join-Path $dir "tree_profiles") -Recurse
          Compress-Archive -Path "$dir\*" -DestinationPath "$base\$pkg.zip" -Force
          $exeHash = (Get-FileHash "dist\tgc_gui_2k25_beta5.exe" -Algorithm SHA256).Hash
          "$exeHash  tgc_gui_2k25_beta5.exe" | Out-File "$base\tgc_gui_2k25_beta5.exe.sha256.txt" -Encoding ascii
          $zipHash = (Get-FileHash "$base\$pkg.zip" -Algorithm SHA256).Hash
          "$zipHash  $pkg.zip" | Out-File "$base\$pkg.zip.sha256.txt" -Encoding ascii
          Write-Host "EXE SHA256: $exeHash"
          Write-Host "ZIP SHA256: $zipHash"

      - name: Upload Beta 5 Hotfix workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TGC-Designer-Tools-Beta5-Hotfix-Windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/tgc_gui_2k25_beta5.exe
            dist/release_beta5/*.zip
            dist/release_beta5/*.sha256.txt

      - name: Replace Beta 5 prerelease assets and source tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5.0-2k25-beta5"
          $repo = "${{ github.repository }}"
          $target = "$env:BUILD_SHA"
          if (-not $target) { $target = (git rev-parse HEAD).Trim() }

          git tag -f $tag $target
          git push origin "refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0) { throw "Could not move the Beta 5 source tag to the hotfix commit." }

          $pkg = "TGC-Designer-Tools-2K25-v0.5.0-2k25-beta5-Windows-x64"
          $assets = @(
            "dist\tgc_gui_2k25_beta5.exe",
            "dist\release_beta5\tgc_gui_2k25_beta5.exe.sha256.txt",
            "dist\release_beta5\$pkg.zip",
            "dist\release_beta5\$pkg.zip.sha256.txt"
          )

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $repo --target $target --title "TGC Designer Tools 2K25 - Beta 5 Hotfix" --notes-file "BETA5_HOTFIX.md" --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not update the Beta 5 release metadata." }
            gh release upload $tag --repo $repo @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not replace the Beta 5 release assets." }
          } else {
            gh release create $tag --repo $repo @assets --target $target --title "TGC Designer Tools 2K25 - Beta 5 Hotfix" --notes-file "BETA5_HOTFIX.md" --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not create the Beta 5 hotfix release." }
          }
