name: Apply Beta 3 release patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-beta3:
    if: github.head_ref == 'beta3-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: beta3-staging
          fetch-depth: 0

      - name: Reconstruct and verify Beta 3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .beta3_payload/part_* > /tmp/beta3.patch.b64
          base64 -d /tmp/beta3.patch.b64 > /tmp/beta3.patch.gz
          gzip -dc /tmp/beta3.patch.gz > /tmp/beta3.patch
          echo "39191ec87cd2a15d68c4d35f00bf09108c7e7599c52bfe759c912976d65edb54  /tmp/beta3.patch" | sha256sum -c -

      - name: Apply Beta 3 source patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f README.md
          git apply --whitespace=nowarn /tmp/beta3.patch

      - name: Syntax-check production Python modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tgc_gui.py dem_map_api.py lidar_map_api.py lidar_fast_native.py usgs_lidar_parser.py infill_image.py tgc_image_terrain.py OSMTGC.py auto_red_mask.py cfs_georef.py lidar_feature_filter.py osm_alignment_viewer.py

      - name: Remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .beta3_payload .beta3_patch_chunks
          rm -f .github/workflows/beta3-apply.yml

      - name: Commit Beta 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.5.0-2k25-beta3"
          git push origin HEAD:beta3-staging
