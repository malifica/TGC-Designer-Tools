name: Publish Beta 6 Tree Notice Hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-beta6-tree-notice.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: beta6-release-publication
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
  BASE_SHA: 14e3062d1359118957f4fe3173c90db13102b365
  TAG_NAME: v0.5.0-2k25-beta6
  EXE_NAME: tgc_gui_2k25_beta6
  PACKAGE_NAME: TGC-Designer-Tools-2K25-v0.5.0-2k25-beta6-Windows-x64
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out current Beta 6
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up existing Python version
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.6'
          architecture: x64
          cache: pip
      - name: Apply approved tree update and canonical Beta 6 title
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import ast, base64, gzip, hashlib, importlib.util, json, os, subprocess, tempfile, urllib.request
          root = Path.cwd()
          workflow = '.github/workflows/publish-beta6-tree-notice.yml'
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          assert git('diff','--name-only',os.environ['BASE_SHA'],'HEAD').splitlines() == [workflow], 'Unexpected concurrent source changes'
          assert git('rev-parse','refs/tags/'+os.environ['TAG_NAME']) == os.environ['BASE_SHA'], 'Release tag changed'
          tracked = git('ls-files').splitlines()
          before = {p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in tracked if p != workflow}
          blobs = ['15b35f709919152fdfd3bdfa687068c66580085a','fb46f73615ee3eced23b7d05b9222f1c3664ae14','e060739e7ba438b50a0b3c9313e99ccbc9e43cee','f18a040aa7076f31f61b09badb7ae9bf1b130dac','bad29855e8624224312f2a1f8866b04f6bdf56c4','81bf71cb2e3584688262bdf9e1f33b4333292c5b','c5948722e9c63ac16cc4a1efd9bfbff61e4cae73','993e3f845d00e5284535a374dedc0fef5d3c6424','b129b1fc1e0a53404fa604a8e71a126152206bb8']
          chunks = []
          for sha in blobs:
              req = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response: obj = json.load(response)
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha
              chunks.append(data)
          packed = b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest() == '473d27df3dd25ae44bf1e75c078477e74147bb001c98b9a63dcd03bd4ad06dc7', 'Transfer digest mismatch'
          files = json.loads(gzip.decompress(packed))
          expected = {'APPLY_BETA6_TREE_FILTER.py','reference/tree_filter_before.py','payload/lidar_tree_topology.py','payload/VERIFY_BETA6_TREE_TOPOLOGY.py'}
          assert set(files) == expected
          with tempfile.TemporaryDirectory(prefix='approved-tree-notice-') as temp:
              package = Path(temp)
              for name, text in files.items():
                  p = package/name; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(text.encode('utf-8'))
              spec = importlib.util.spec_from_file_location('approved_update',package/'APPLY_BETA6_TREE_FILTER.py')
              updater = importlib.util.module_from_spec(spec); spec.loader.exec_module(updater)
              updater.apply(root,package)
              assert updater.apply(root,package) is None, 'Second application changed source'
          runtime = {'lidar_feature_filter.py','tgc_image_terrain.py','tgc_gui.py','lidar_tree_topology.py','VERIFY_BETA6_TREE_TOPOLOGY.py'}
          for p, digest in before.items():
              if p not in {'lidar_feature_filter.py','tgc_image_terrain.py'}:
                  assert hashlib.sha256((root/p).read_bytes()).hexdigest() == digest, 'Unrelated source changed: '+p
          gui = root/'tgc_gui.py'
          raw = gui.read_bytes()
          old = b'root.title(TGC_APP_TITLE + " - LiDAR Tree Size TEST 1")'
          assert raw.count(old) == 1, 'Unexpected title override'
          gui.write_bytes(raw.replace(old,b'root.title(TGC_APP_TITLE)',1))
          parsed = ast.parse(gui.read_text(encoding='utf-8-sig'))
          values = {n.targets[0].id:ast.literal_eval(n.value) for n in parsed.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id in {'TGC_APP_TITLE','TGC_GUI_VERSION'}}
          assert values == {'TGC_APP_TITLE':'TGC Designer Tools 2K25 - Beta 6','TGC_GUI_VERSION':'v0.5.0-2k25-beta6'}
          for n in ast.walk(parsed):
              if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and isinstance(n.func.value,ast.Name) and n.func.value.id == 'root' and n.func.attr in ('title','wm_title') and n.args:
                  assert len(n.args)==1 and isinstance(n.args[0],ast.Name) and n.args[0].id=='TGC_APP_TITLE'
          highlights = '''## Tree topology and nonfatal OSM notices hotfix

          - Maintained green, fairway and bunker areas reject new LiDAR trees; confirmed fully contained rough islands remain eligible, subject to other exclusions.
          - OSM rough uses outer-minus-inner topology. Broad surrounding rough no longer grants a fairway-tree exception.
          - Ambiguous mixed golf tags and unusable tree-topology items print terminal NOTICE messages instead of aborting tree filtering. Trees are denied in the affected outer footprints, including inner areas.
          - When complete affected bounds cannot be recovered safely, new LiDAR trees are disabled for that import while processing continues. Healthy areas retain their normal filtering when the fault can be localized.
          - EXE: `tgc_gui_2k25_beta6.exe`. Main window: `TGC Designer Tools 2K25 - Beta 6`. No TEST or hotfix suffix is displayed.
          - Prior multipolygon-preview, mandatory mulch-water, tree-sizing, CFS/mask and regional-profile fixes are retained. Tree detection/sizing, mask coordinates, Hulkify and spline geometry are unchanged. Course Finisher is not updated.

          Reuse the processed heightmap and regenerate the TGC course before Course Finisher. This filter affects newly generated LiDAR trees; it does not remove existing trees from saved finished courses or edit the OSM/server. This is a tree-filter correction, not a change to the spline importer's green-relation coverage. Invalid JSON or unrelated processing errors are not suppressed.

          '''
          highlights = '\n'.join(line[10:] if line.startswith('          ') else line for line in highlights.split('\n'))
          def insert(name, text):
              p=root/name; title,sep,body=p.read_text(encoding='utf-8-sig').partition('\n')
              assert sep and title.startswith('#'), name
              p.write_bytes((title+'\n\n'+text+body.lstrip('\n')).encode('utf-8'))
          for name in ('RELEASE_NOTES_v0.5.0-2k25-beta6.md','BETA6_HOTFIX.md','CHANGELOG.md'): insert(name,highlights)
          insert('README.md','## Beta 6 tree-filter hotfix\n\nTree eligibility now respects rough-island topology. Ambiguous OSM items produce NOTICE messages and conservative no-tree restrictions instead of stopping tree filtering. The standard Beta 6 filename and window title are retained. See `BETA6_TREE_NOTICE_HOTFIX.md`.\n\n')
          (root/'BETA6_TREE_NOTICE_HOTFIX.md').write_bytes(('# Beta 6 - Tree Topology and Nonfatal OSM Notices\n\n'+highlights).encode('utf-8'))
          build=root/'BUILD_TGC_2K25_BETA6.bat'; text=build.read_text(encoding='utf-8-sig')
          anchor='python VERIFY_BETA6_MULTIPOLYGON_MULCH_V1.py\nif errorlevel 1 goto :fail'
          assert text.count(anchor)==1
          text=text.replace(anchor,'python VERIFY_BETA6_TREE_TOPOLOGY.py\nif errorlevel 1 goto :fail\n\n'+anchor)
          assert text.count('   --onefile ^')==2
          text=text.replace('   --onefile ^','   --onefile ^\n   --hidden-import lidar_tree_topology ^')
          anchor='copy /y "BETA6_PREVIEW_MULCH_MANIFEST.json" "%RELEASEDIR%\\" >nul'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+'\ncopy /y "BETA6_TREE_NOTICE_HOTFIX.md" "%RELEASEDIR%\\" >nul\ncopy /y "BETA6_TREE_NOTICE_MANIFEST.json" "%RELEASEDIR%\\" >nul')
          build.write_bytes(text.replace('\n','\r\n').encode('utf-8'))
          docs={'BUILD_TGC_2K25_BETA6.bat','README.md','CHANGELOG.md','BETA6_HOTFIX.md','RELEASE_NOTES_v0.5.0-2k25-beta6.md','BETA6_TREE_NOTICE_HOTFIX.md','BETA6_TREE_NOTICE_MANIFEST.json'}
          allowed=runtime|docs
          manifest={'hotfix':'Beta 6 tree topology and nonfatal OSM notices','base_commit':os.environ['BASE_SHA'],'approved_package_sha256':'6a3fca499313a89229c50caeddc0bda6c9fd8f7718a1c508b05d1f62d95f24de','runtime_sha256':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in sorted(runtime)},'preserved_sha256':{p:h for p,h in before.items() if p not in allowed},'allowed_source_paths':sorted(allowed),'window_title':values['TGC_APP_TITLE'],'exe_name':'tgc_gui_2k25_beta6.exe','designer_visual_test':'not performed by CI'}
          (root/'BETA6_TREE_NOTICE_MANIFEST.json').write_bytes((json.dumps(manifest,indent=2)+'\n').encode())
          for p,h in manifest['preserved_sha256'].items(): assert hashlib.sha256((root/p).read_bytes()).hexdigest()==h,p
          dest=root/'publication'/'source'
          for name in allowed:
              p=dest/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes((root/name).read_bytes())
          print('Approved tree payloads installed; unrelated source preserved; canonical Beta 6 title verified.')
      - name: Install existing requirements
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Requirements installation failed' }
      - name: Run tree topology and retained regression checks with native overpy
        shell: python
        run: |
          import subprocess,sys,overpy
          scripts=['VERIFY_BETA6_TREE_TOPOLOGY.py','VERIFY_BETA6_MULTIPOLYGON_MULCH_V1.py','VERIFY_BETA6_SPLINE_SURFACE_FIX_V1.py','VERIFY_BETA6_SOURCE.py','VERIFY_BETA6_CFS_MASK_ALIGNMENT_WORKFLOW_V1.py','VERIFY_BETA6_WORKFLOW_UI_REORDER_V2.py','VERIFY_BETA6_CFS_ASYNC_MASK_REBUILD_V3.py','VERIFY_BETA6_OSM_ROAD_SPLIT_V4.py','VERIFY_BETA6_CUSTOM_UNMATCHED_OSM_V5.py','VERIFY_BETA6_CUSTOM_UNMATCHED_OSM_V5_1.py']
          for script in scripts:
              print('\n=== '+script+' ===',flush=True)
              subprocess.run([sys.executable,script],check=True)
          subprocess.run([sys.executable,'tgc_tree_size_test1_entry.py','--verify-lidar-trees'],check=True)
      - name: Compile unchanged native LiDAR rasterizer
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'MinGW installation failed' }
          $gcc=Get-ChildItem -Path 'C:\ProgramData\mingw64','C:\ProgramData\chocolatey','C:\tools' -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'mingw64.*bin.*gcc\.exe$' } | Select-Object -First 1
          if (-not $gcc) { throw 'Native compiler not found' }
          & $gcc.FullName -O3 -shared -std=c11 -s -o tgc_lidar_fast_native.dll lidar_fast_native.c -lm
          if ($LASTEXITCODE -ne 0) { throw 'Native LiDAR compilation failed' }
      - name: Build standard Beta 6 EXE once
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name "$env:EXE_NAME" --hidden-import lidar_tree_topology --add-binary './laszip/laszip-cli.exe;laszip' --add-binary 'tgc_lidar_fast_native.dll;.' --additional-hooks-dir './PyInstaller/hooks/' --runtime-hook './PyInstaller/rthook_rasterio.py' --add-data './tree_profiles;tree_profiles' tgc_tree_size_test1_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'EXE build failed' }
          if ((Get-Item "dist\$env:EXE_NAME.exe").Length -lt 100MB) { throw 'EXE unexpectedly small' }
          & "dist\$env:EXE_NAME.exe" --verify-lidar-trees
          if ($LASTEXITCODE -ne 0) { throw 'Frozen tree-size verification failed' }
          python -c "from PyInstaller.archive.readers import ZlibArchiveReader; r=ZlibArchiveReader('build/tgc_gui_2k25_beta6/PYZ-00.pyz'); needed={'lidar_tree_topology','osm_preview_relations','osm_water_mulch_lock','tree_profile_manager'}; assert needed.issubset(r.toc),needed-set(r.toc); assert 'TGC_TREE_SURFACE_NOTICE_DENY_V1' in r.extract('lidar_tree_topology').co_consts; print('Approved topology and retained hotfix modules bundled')"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled module verification failed' }
      - name: Package exact EXE and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path.cwd(); out=root/'publication'; assets=out/'assets';assets.mkdir(exist_ok=True)
          exe=os.environ['EXE_NAME']+'.exe';pkg=os.environ['PACKAGE_NAME']
          shutil.copy2(root/'dist'/exe,assets/exe)
          package=root/'dist'/'release_beta6'/pkg;package.mkdir(parents=True)
          shutil.copy2(assets/exe,package/exe)
          docs=['LICENSE','README.md','CHANGELOG.md','BUILD_WINDOWS.md','BETA6_TREE_PROFILES.md','BETA6_LIDAR_TREE_HOTFIX.md','BETA6_HOTFIX.md','BETA6_MULTIPOLYGON_MULCH_HOTFIX.md','BETA6_PREVIEW_MULCH_MANIFEST.json','BETA6_TREE_NOTICE_HOTFIX.md','BETA6_TREE_NOTICE_MANIFEST.json','RELEASE_NOTES_v0.5.0-2k25-beta6.md']
          for p in docs:shutil.copy2(root/p,package/p)
          shutil.copy2(root/'extras'/'splines.json',package/'splines.json')
          shutil.copytree(root/'tree_profiles',package/'tree_profiles')
          for p in ['BETA6_OSM_CARTPATH_ROAD_SPLIT_V4.txt','BETA6_OSM_GOLF_PATH_ONLY_V4_1.txt','SPLINES_JSON_ROAD_EXAMPLE.json','BETA6_CUSTOM_UNMATCHED_OSM_V5_1.txt']:
              if (root/p).is_file():shutil.copy2(root/p,package/p)
          archive=assets/(pkg+'.zip')
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(package.rglob('*')):
                  if p.is_file():z.write(p,p.relative_to(package).as_posix())
          def digest(p):return hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
          expected={}
          for p in [assets/exe,archive]:
              h=digest(p);check=assets/(p.name+'.sha256.txt');check.write_bytes((h+'  '+p.name+'\n').encode('ascii'))
              expected[p.name]={'sha256':h,'bytes':p.stat().st_size}
              expected[check.name]={'sha256':digest(check),'bytes':check.stat().st_size}
              print(p.name,h,p.stat().st_size)
          (out/'published-assets.json').write_text(json.dumps(expected,indent=2),encoding='utf-8')
          with zipfile.ZipFile(archive) as z:
              assert hashlib.sha256(z.read(exe)).hexdigest()==expected[exe]['sha256']
              assert 'tree_profiles/pacific_northwest.json' in z.namelist()
      - name: Retain exact source and built assets for recovery without rebuilding
        uses: actions/upload-artifact@v6
        with:
          name: Beta6-Tree-Notice-Hotfix
          path: publication/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Commit matching source and update Beta 6 refs
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('ls-remote','origin','refs/heads/main').split()[0]==os.environ['GITHUB_SHA'],'main advanced during build'
          assert git('ls-remote','origin','refs/tags/'+os.environ['TAG_NAME']).split()[0]==os.environ['BASE_SHA'],'release tag advanced'
          m=json.loads(Path('BETA6_TREE_NOTICE_MANIFEST.json').read_text())
          for p,h in {**m['preserved_sha256'],**m['runtime_sha256']}.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          allowed=m['allowed_source_paths']
          assert not (set(git('diff','--name-only').splitlines())-set(allowed)),'Unexpected tracked changes'
          for p in allowed:assert Path(p).read_bytes()==(Path('publication/source')/p).read_bytes(),p
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('rm','.github/workflows/publish-beta6-tree-notice.yml')
          git('add','-f','--',*allowed)
          git('commit','-m','Beta 6 Hotfix: topology-aware tree filtering and nonfatal OSM notices')
          sha=git('rev-parse','HEAD')
          git('push','--atomic','--force-with-lease=refs/tags/'+os.environ['TAG_NAME']+':'+os.environ['BASE_SHA'],'origin','HEAD:refs/heads/main','HEAD:refs/tags/'+os.environ['TAG_NAME'])
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('HOTFIX_SOURCE_SHA='+sha+'\n')
          print('Published matching source:',sha)
      - name: Replace existing release assets and notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG_NAME "publication/assets/$env:EXE_NAME.exe" "publication/assets/$env:EXE_NAME.exe.sha256.txt" "publication/assets/$env:PACKAGE_NAME.zip" "publication/assets/$env:PACKAGE_NAME.zip.sha256.txt" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; retained artifact is available without rebuild' }
          gh release edit $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --title 'TGC Designer Tools 2K25 - Beta 6 Hotfix' --notes-file RELEASE_NOTES_v0.5.0-2k25-beta6.md --prerelease --target $env:HOTFIX_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
      - name: Verify live release refs and all four asset digests
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import json,os,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path],text=True))
          sha=os.environ['HOTFIX_SOURCE_SHA'];tag=os.environ['TAG_NAME']
          assert api('git/ref/heads/main')['object']['sha']==sha
          assert api('git/ref/tags/'+tag)['object']['sha']==sha
          rel=api('releases/tags/'+tag); assert rel['prerelease'] and not rel['draft']
          assert rel['name']=='TGC Designer Tools 2K25 - Beta 6 Hotfix'
          actual={a['name']:a for a in rel['assets']}
          for name,e in json.loads(Path('publication/published-assets.json').read_text()).items():
              a=actual[name]; assert a['state']=='uploaded' and a['size']==e['bytes'] and a['digest']=='sha256:'+e['sha256'],name
          print('PUBLICATION VERIFIED:',sha,rel['html_url'])
